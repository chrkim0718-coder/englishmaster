<!DOCTYPE html>
<html>
<head>
  <title>EmailJS Test v4</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
      emailjs.init({
        publicKey: "P2evr2sXWGrx7BThh"
      });
    })();
    function sendEmail() {
      var templateParams = {
        to_email: "phiskim@gmail.com",
        temp_password: "test1234"
      };
      emailjs.send("service_7vpu2xw", "template_fdoifna", templateParams)
        .then(function(response) {
          alert('SUCCESS! ' + response.status + ' ' + response.text);
          console.log('SUCCESS!', response.status, response.text);
        }, function(error) {
          alert('FAILED... ' + JSON.stringify(error));
          console.log('FAILED...', error);
        });
    }
  </script>
</head>
<body>
  <h2>EmailJS 임시비밀번호 테스트 (v4)</h2>
  <button onclick="sendEmail()">메일 보내기</button>
</body>
</html>
